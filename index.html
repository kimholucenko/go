<!doctype html>
<meta charset="utf-8">
<title>Открываю Obsidian…</title>
<script>
  const file = new URLSearchParams(location.search).get("file") || "Playground Home";
  const url = "obsidian://open?vault=Playground&file=" + encodeURIComponent(file);
  location.href = url;
  setTimeout(() => window.close(), 1500);
</script>
<p>Открываю Obsidian… <a href="" id="a">Нажми, если не открылось</a></p>
<script>document.getElementById("a").href = url;</script>
